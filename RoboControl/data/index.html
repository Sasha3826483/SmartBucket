<!doctype html>
<html lang="ru">
  <head>
    <!-- Устанавливаем кодировку UTF-8 для корректного отображения текста. -->
    <meta charset="UTF-8" />
    <!-- Настраиваем адаптацию страницы под разные размеры экрана. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <!-- Заголовок страницы, который будет отображаться в браузере. -->
    <title>Robot control</title>

    <!-- Внутри этого блока описаны стили интерфейса страницы. -->
    <style>
      :root {
        /* Присваиваем цветовую схему и переменные для повторного использования в CSS. */
        color-scheme: dark;
        --bg: #101417;
        --panel: #1b2227;
        --line: #35434a;
        --accent: #65d6bd;
        --muted: #93a4aa;
      }

      * {
        /* box-sizing делает размеры элементов предсказуемыми и удобными для верстки. */
        box-sizing: border-box;
        /* Запрещаем выделение текста на мобильных устройствах и в интерфейсе управления. */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      *::selection {
        background: transparent;
      }

      body {
        /* Убираем стандартные отступы и центрируем содержимое страницы. */
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 0%, #26343a, var(--bg) 58%);
        color: #eef5f3;
        font-family: Georgia, "Times New Roman", serif;
        user-select: none;
      }

      main {
        /* Контейнер main ограничивает ширину страницы и формирует общий макет. */
        width: min(680px, 100%);
      }

      header {
        /* Шапка страницы располагает заголовок и статус в одну строку. */
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid var(--line);
        padding-bottom: 14px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 7vw, 46px);
        font-weight: 400;
        letter-spacing: 0;
      }

      .status {
        color: var(--muted);
        font:
          13px ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }

      .status.online {
        color: var(--accent);
      }

      .console {
        /* Grid используется, чтобы расположить джойстики в два столбца на десктопе. */
        display: grid;
        grid-template-columns: repeat(2, minmax(220px, 1fr));
        gap: 28px;
        align-items: center;
      }

      .joystick-wrap {
        /* Обёртка задаёт квадратную форму и центрирует джойстик внутри контейнера. */
        aspect-ratio: 1;
        width: min(100%, 380px);
        justify-self: center;
        display: grid;
        place-items: center;
      }

      .joystick-label {
        margin-bottom: 12px;
        color: var(--muted);
        text-align: center;
        font:
          12px ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        text-transform: uppercase;
      }

      .joystick {
        /* Этот div задаёт внешний круг джойстика, в котором будет двигаться ручка. */
        position: relative;
        width: 100%;
        height: 100%;
        border: 1px solid var(--line);
        border-radius: 50%;
        background:
          repeating-radial-gradient(
            circle,
            transparent 0 29%,
            rgba(101, 214, 189, 0.08) 29.2% 29.7%
          ),
          #151c20;
        touch-action: none;
      }

      .joystick::before,
      .joystick::after {
        content: "";
        position: absolute;
        background: var(--line);
        opacity: 0.75;
      }

      .joystick::before {
        width: 1px;
        height: 84%;
        top: 8%;
        left: 50%;
      }

      .joystick::after {
        width: 84%;
        height: 1px;
        left: 8%;
        top: 50%;
      }

      .knob {
        /* knob — это подвижная ручка джойстика; JavaScript меняет её transform для смещения. */
        position: absolute;
        z-index: 1;
        width: 31%;
        aspect-ratio: 1;
        left: 34.5%;
        top: 34.5%;
        border-radius: 50%;
        border: 2px solid var(--accent);
        background: #29433f;
        box-shadow: 0 0 30px rgba(101, 214, 189, 0.22);
        pointer-events: none;
        transition: transform 0.08s ease-out;
      }

      .axes {
        margin-top: 28px;
        color: var(--muted);
        font:
          13px ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        text-align: center;
      }

      @media (max-width: 600px) {
        /* На небольших экранах уменьшаем отступы и перестраиваем layout. */
        body {
          padding: 18px;
        }

        .console {
          grid-template-columns: 1fr;
          gap: 18px;
        }

        .joystick-wrap {
          width: min(88vw, 400px);
        }
      }

      @media screen and (orientation: landscape) and (max-height: 600px) {
        /* Дополнительная адаптация для компактных ландшафтных экранов. */
        body {
          min-height: 100svh;
          padding: max(8px, env(safe-area-inset-top))
            max(12px, env(safe-area-inset-right))
            max(8px, env(safe-area-inset-bottom))
            max(12px, env(safe-area-inset-left));
          place-items: start center;
          overflow: hidden;
        }

        main {
          width: min(820px, 100%);
        }

        header {
          padding-bottom: 8px;
          margin-bottom: 10px;
        }

        h1 {
          font-size: 26px;
        }

        .status {
          font-size: 11px;
        }

        .console {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
        }

        .console > div {
          min-width: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .joystick-label {
          margin-bottom: 5px;
          font-size: 10px;
        }

        .joystick-wrap {
          width: min(46vw, 58svh, 280px);
        }

        .axes {
          margin-top: 10px;
          font-size: 11px;
        }
      }
    </style>
  </head>

  <body>
    <!-- main содержит основное содержимое страницы. -->
    <main>
      <!-- Шапка страницы: заголовок и статус соединения через WebSocket. -->
      <header>
        <h1>Robot</h1>
        <span class="status" id="status">offline</span>
      </header>

      <!-- Здесь располагаются два джойстика для управления движением и поворотом. -->
      <section class="console">
        <div>
          <div class="joystick-label">Move</div>
          <div class="joystick-wrap">
            <!-- id нужен JavaScript, чтобы связать элемент с DOM. -->
            <div
              class="joystick"
              id="moveJoystick"
              aria-label="Movement joystick"
            >
              <!-- Внутри джойстика находится подвижная ручка. -->
              <div class="knob" id="moveKnob"></div>
            </div>
          </div>
        </div>

        <div>
          <div class="joystick-label">Rotate</div>
          <div class="joystick-wrap">
            <div
              class="joystick"
              id="rotateJoystick"
              aria-label="Rotation joystick"
            >
              <div class="knob" id="rotateKnob"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Здесь отображаются текущие значения осей движения, обновляемые JavaScript. -->
      <div class="axes">
        vx <span id="vx">0</span> &nbsp; vy <span id="vy">0</span> &nbsp; vz
        <span id="vz">0</span>
      </div>

      <div class="telemetry" style="margin-top: 24px; border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: rgba(27, 34, 39, 0.8);">
        <div class="joystick-label" style="margin-bottom: 14px;">Telemetry</div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 12px; color: var(--muted); font: 13px ui-monospace, SFMono-Regular, Consolas, monospace;">
          <div>LF <span id="lfSpeed" style="color: var(--accent);">0</span> rpm</div>
          <div>RF <span id="rfSpeed" style="color: var(--accent);">0</span> rpm</div>
          <div>LB <span id="lbSpeed" style="color: var(--accent);">0</span> rpm</div>
          <div>RB <span id="rbSpeed" style="color: var(--accent);">0</span> rpm</div>
        </div>
        <div style="margin-top: 14px; color: var(--muted); font: 13px ui-monospace, SFMono-Regular, Consolas, monospace;">
          Status: <span id="telemetryStatus" style="color: var(--accent);">waiting</span>
        </div>
      </div>
    </main>

    <!-- JavaScript отвечает за интерфейс и обмен данными с ESP8266. -->
    <script>
      // Частота отправки команд на ESP8266: примерно 80 мс между пакетами.
      const HEARTBEAT_MS = 80;
      // Мёртвая зона для джойстика, чтобы небольшие отклонения не давали команды.
      const JOYSTICK_DEAD_ZONE = 0.18;
      // Параметр чувствительности джойстика: чем выше, тем мягче отклик.
      const JOYSTICK_RESPONSE = 1.7;
      // Мёртвая зона для геймпада: игнорируем малые значения осей.
      const GAMEPAD_DEAD_ZONE = 0.25;
      const GAMEPAD_RESPONSE = 2.5;
      // Коэффициент сглаживания: уменьшает резкие скачки управляющих значений.
      const SMOOTHING_FACTOR = 0.2;//0.16;
      const MAX_COMMAND = 60;

      // Ссылки на элементы интерфейса и WebSocket-соединение.
      const status = document.getElementById("status");
      const telemetryStatus = document.getElementById("telemetryStatus");
      const telemetryEls = {
        lf: document.getElementById("lfSpeed"),
        rf: document.getElementById("rfSpeed"),
        lb: document.getElementById("lbSpeed"),
        rb: document.getElementById("rbSpeed"),
      };

      // values — текущие отображаемые значения, targetValues — целевые значения.
      const values = { vx: 0, vy: 0, vz: 0 };
      const targetValues = { vx: 0, vy: 0, vz: 0 };
      // Индекс активного геймпада, если он был обнаружен через navigator.getGamepads().
      let gamepadIndex = null;
      let socket;
      let reconnectTimer;

      function clamp(value, min, max) {
        // Ограничиваем значение диапазоном [min, max].
        return Math.max(min, Math.min(max, value));
      }

      function updateDisplay() {
        // textContent записывает текст в span-элементы HTML.
        document.getElementById("vx").textContent = Math.round(values.vx);
        document.getElementById("vy").textContent = Math.round(values.vy);
        document.getElementById("vz").textContent = Math.round(values.vz);
      }

      function setMovement(vx, vy) {
        // Устанавливаем текущие целевые значения по осям X и Y, ограничивая их диапазоном.
        targetValues.vx = clamp(vx, -MAX_COMMAND, MAX_COMMAND);
        targetValues.vy = clamp(vy, -MAX_COMMAND, MAX_COMMAND);
      }

      function shapeJoystickAxis(value) {
        // Преобразуем вход в более линейный и удобный для управления диапазон.
        const magnitude = Math.abs(value);
        if (magnitude <= JOYSTICK_DEAD_ZONE) return 0;

        // Нормализуем отклонение от 0 до 1 после мёртвой зоны.
        const adjusted =
          (magnitude - JOYSTICK_DEAD_ZONE) / (1 - JOYSTICK_DEAD_ZONE);
        // Применяем степенную кривую для изменения чувствительности.
        return Math.sign(value) * Math.pow(adjusted, JOYSTICK_RESPONSE);
      }

      function shapeGamepadAxis(value) {
        const magnitude = Math.abs(value);
        if (magnitude <= GAMEPAD_DEAD_ZONE) return 0;

        const adjusted =
          (magnitude - GAMEPAD_DEAD_ZONE) / (1 - GAMEPAD_DEAD_ZONE);
        return Math.sign(value) * Math.pow(adjusted, GAMEPAD_RESPONSE);
      }

      function readGamepad() {
        // Gamepad API позволяет читать состояние подключённого геймпада.
        if (navigator.getGamepads) {
          const gamepads = navigator.getGamepads();
          // Если индекс не задан, выбираем первый доступный контроллер.
          let gamepad =
            gamepadIndex === null
              ? Array.from(gamepads).find(Boolean)
              : gamepads[gamepadIndex];

          if (gamepad) {
            gamepadIndex = gamepad.index;
            // Извлекаем оси: X/Y для движения и X для поворота.
            const leftX = shapeGamepadAxis(gamepad.axes[0] || 0);
            const leftY = shapeGamepadAxis(gamepad.axes[1] || 0);
            const rightX = shapeGamepadAxis(gamepad.axes[2] || 0);

            setMovement(leftX * MAX_COMMAND, -leftY * MAX_COMMAND);
            targetValues.vz = rightX * MAX_COMMAND;
          }
        }
        // Повторяем чтение на каждом кадре анимации.
        requestAnimationFrame(readGamepad);
      }

      function smoothValues() {
        // Для управления используем уже сформированные целевые значения без дополнительного сглаживания.
        values.vx = targetValues.vx;
        values.vy = targetValues.vy;
        values.vz = targetValues.vz;
        updateDisplay();
        requestAnimationFrame(smoothValues);
      }

      function createJoystick(elementId, knobId, onMove, onReset) {
        // Создаём общий обработчик для джойстиков Move и Rotate.
        const element = document.getElementById(elementId);
        const knob = document.getElementById(knobId);

        function reset() {
          // Возвращаем ручку в центр и сбрасываем связанные значения.
          knob.style.transform = "translate(0, 0)";
          onReset();
        }

        function move(event) {
          // Получаем координаты указателя относительно центра джойстика.
          const rect = element.getBoundingClientRect();
          const radius = rect.width / 2;
          const maxOffset = radius * 0.69;
          let dx = event.clientX - (rect.left + radius);
          let dy = event.clientY - (rect.top + radius);
          const length = Math.hypot(dx, dy);

          // Ограничиваем перемещение ручки радиусом джойстика.
          if (length > maxOffset) {
            dx = (dx * maxOffset) / length;
            dy = (dy * maxOffset) / length;
          }

          // Смещаем ручку внутри джойстика.
          knob.style.transform = `translate(${dx}px, ${dy}px)`;
          onMove(dx / maxOffset, dy / maxOffset);
        }

        // Callback срабатывает при нажатии на джойстик.
        element.addEventListener("pointerdown", (event) => {
          element.setPointerCapture(event.pointerId);
          move(event);
        });

        // Callback срабатывает при перемещении пальца/курсора по джойстику.
        element.addEventListener("pointermove", (event) => {
          if (element.hasPointerCapture(event.pointerId)) move(event);
        });

        // Callback вызывается после отпускания указателя и возвращает джойстик в центр.
        element.addEventListener("pointerup", (event) => {
          element.releasePointerCapture(event.pointerId);
          reset();
        });

        // Callback используется для безопасного сброса состояния при отмене ввода.
        element.addEventListener("pointercancel", reset);
      }

      createJoystick(
        "moveJoystick",
        "moveKnob",
        (x, y) => {
          // Move задаёт управление по осям: X соответствует vx, Y — vy.
          setMovement(
            shapeJoystickAxis(x) * MAX_COMMAND,
            -shapeJoystickAxis(y) * MAX_COMMAND,
          );
        },
        () => {
          setMovement(0, 0);
        },
      );

      createJoystick(
        "rotateJoystick",
        "rotateKnob",
        (x) => {
          // Rotate задаёт вращение по оси vz.
          targetValues.vz = shapeJoystickAxis(x) * MAX_COMMAND;
        },
        () => {
          targetValues.vz = 0;
        },
      );

      // Сопоставление клавиш клавиатуры с командами движения и поворота.
      const keyMap = {
        w: [0, MAX_COMMAND, 0],
        ArrowUp: [0, MAX_COMMAND, 0],
        s: [0, -MAX_COMMAND, 0],
        ArrowDown: [0, -MAX_COMMAND, 0],
        a: [-MAX_COMMAND, 0, 0],
        ArrowLeft: [-MAX_COMMAND, 0, 0],
        d: [MAX_COMMAND, 0, 0],
        ArrowRight: [MAX_COMMAND, 0, 0],
        q: [0, 0, -MAX_COMMAND],
        e: [0, 0, MAX_COMMAND],
      };

      const pressed = new Set();

      // Сохраняем индекс геймпада после его подключения.
      window.addEventListener("gamepadconnected", (event) => {
        gamepadIndex = event.gamepad.index;
      });

      window.addEventListener("gamepaddisconnected", (event) => {
        if (event.gamepad.index !== gamepadIndex) return;

        // При отключении геймпада сбрасываем текущий индекс и значения управления.
        gamepadIndex = null;
        setMovement(0, 0);
        targetValues.vz = 0;
      });

      window.addEventListener("keydown", (event) => {
        const motion = keyMap[event.key];
        if (!motion) return;

        // Блокируем стандартное поведение страницы, чтобы клавиши управляли роботом.
        event.preventDefault();
        pressed.add(event.key);
        setMovement(motion[0], motion[1]);

        if (motion[2]) {
          targetValues.vz = motion[2];
        }
      });

      window.addEventListener("keyup", (event) => {
        if (!pressed.delete(event.key)) return;

        if (!pressed.size) {
          setMovement(0, 0);
          targetValues.vz = 0;
        }
      });

      function connect() {
        // WebSocket нужен для связи этой HTML-страницы с ESP8266.
        socket = new WebSocket(
          `${location.protocol === "https:" ? "wss" : "ws"}://${location.hostname}:81/`,
        );

        socket.addEventListener("open", () => {
          // Соединение с ESP8266 установлено.
          status.textContent = "online";
          status.classList.add("online");
        });

        socket.addEventListener("message", (event) => {
          try {
            const message = JSON.parse(event.data);
            if (message.type !== "telemetry") {
              return;
            }

            telemetryEls.lf.textContent = Math.round(message.lf ?? 0);
            telemetryEls.rf.textContent = Math.round(message.rf ?? 0);
            telemetryEls.lb.textContent = Math.round(message.lb ?? 0);
            telemetryEls.rb.textContent = Math.round(message.rb ?? 0);
            telemetryStatus.textContent = message.status ? "ok" : "idle";
            telemetryStatus.style.color = message.status ? "var(--accent)" : "var(--muted)";
          } catch (error) {
            // Игнорируем не-JSON сообщения, например подтверждения управления.
          }
        });

        socket.addEventListener("close", () => {
          // Если соединение разорвалось, обновляем статусы и пробуем переподключиться.
          status.textContent = "offline";
          status.classList.remove("online");
          telemetryStatus.textContent = "waiting";
          telemetryStatus.style.color = "var(--muted)";
          clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(connect, 1000);
        });

        socket.addEventListener("error", () => {
          socket.close();
        });
      }

      setInterval(() => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          // Отправляем текущие команды в JSON-формате через WebSocket на ESP8266.
          socket.send(
            JSON.stringify({
              vx: Math.round(values.vx),
              vy: Math.round(values.vy),
              vz: Math.round(values.vz),
            }),
          );
        }
      }, HEARTBEAT_MS);

      updateDisplay();
      // Запускаем циклы обновления интерфейса и чтения геймпада.
      requestAnimationFrame(smoothValues);
      requestAnimationFrame(readGamepad);
      connect();
    </script>
  </body>
</html>
